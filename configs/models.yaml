# Pin exact snapshot IDs and published training cutoffs (cutoff is a regression variable).
# Fill in before running C0. Limit matrix to 5–6 models.
defaults:
  temperature: 0
  max_tokens: 512

models:
  # --- Closed API, cheapest tier per vendor ---
  - id: gpt-mini
    provider: openai
    snapshot: ""          # e.g. exact dated model string
    cutoff: ""            # YYYY-MM
    subset: stratified_600
  - id: gemini-flash
    provider: gemini
    snapshot: "gemini-3.5-flash-lite"   # version 3.5-flash-lite-07-2026; no pinned id is callable,
                                        # each cached call records usage.model_version
    cutoff: "2026-03"     # model card (published 21/07/2026): "knowledge cutoff ... March 2026", but some
                          # domains "limited to January 2025". https://deepmind.google/models/model-cards/gemini-3-5-flash-lite/
    subset: stratified_600
  - id: claude-haiku
    provider: anthropic
    snapshot: ""
    cutoff: ""
    subset: stratified_600

  # --- Open multilingual (vLLM) ---
  - id: qwen-7b
    provider: vllm
    snapshot: "Qwen/Qwen2.5-7B-Instruct-AWQ"   # vLLM smoke test on Colab T4, 22/11/2026
    cutoff: ""            # No official dated cutoff found (web search 26/11/2026; tech report arXiv:2412.15115
                          # not fully checked). Third-party listings (OpenRouter) give 2024-06-30: not official, not used.
  - id: llama-3-8b-instruct
    provider: vllm
    snapshot: ""
    cutoff: ""

  # --- Vietnamese-specialised ---
  - id: seallm-7b
    provider: vllm
    snapshot: ""
    cutoff: ""
