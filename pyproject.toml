[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-admin2025"
version = "0.1.0"
description = "Measuring LLM temporal staleness on Vietnam's 2025 administrative reform and RAG mitigation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "tqdm>=4.66",
  "httpx>=0.27",
  "openai>=1.40",
]

[project.optional-dependencies]
rag = [
  "FlagEmbedding>=1.2",
  "qdrant-client>=1.9",
  "chromadb>=0.5",
  "rank-bm25>=0.2.2",
  "underthesea>=6.8",
  "pymupdf4llm>=0.0.10",
]
ocr = ["easyocr>=1.7"]
api = ["anthropic>=0.34", "google-genai>=0.3"]
vllm = ["vllm>=0.5"]
eval = ["statsmodels>=0.14", "scikit-learn>=1.4", "matplotlib>=3.8", "seaborn>=0.13"]
demo = ["streamlit>=1.36"]
dev = ["pytest>=8.0", "ruff>=0.5", "jupyter>=1.0"]

[tool.setuptools.packages.find]
include = ["rag*", "eval*", "qgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
